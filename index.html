<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10131b">
  <title>Hear KnightSax Alto · Real Sax Sound</title>
  <style>
    :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; background: #10131b; color: #f8f5ee; }
    main { width: min(100% - 40px, 440px); padding: 36px 0; }
    .eyebrow { color: #e8b665; font-size: 12px; font-weight: 700; letter-spacing: .17em; text-transform: uppercase; }
    h1 { margin: 12px 0; font-size: clamp(40px, 10vw, 64px); line-height: .98; letter-spacing: -.06em; }
    p { color: #c3c7d0; font-size: 17px; line-height: 1.5; }
    .card { margin-top: 32px; padding: 24px; border: 1px solid #3b4150; border-radius: 20px; background: #1a1f2b; }
    .label { margin: 0 0 16px; color: #f8f5ee; font-size: 16px; font-weight: 650; }
    audio { display: block; width: 100%; }
    a { display: inline-block; margin-top: 20px; color: #ffd08a; font-weight: 650; }
    small { display: block; margin-top: 28px; color: #a8aeba; font-size: 14px; line-height: 1.5; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">KnightSax · Alto</div>
    <h1>Hear the real sax.</h1>
    <p>Tap play for a 13-second demo made from real alto sax recordings with growl, vibrato, and mod wheel swells.</p>
    <div class="card">
      <div class="label">Recorded alto sax demo · 0:13</div>
      <audio controls preload="metadata" src="alto-demo-v3.m4a" aria-label="Play new KnightSax Alto demo"></audio>
      <a href="alto-demo-v3.m4a" download="KnightSax-Alto-demo-v3.m4a">Download the audio</a>
    </div>
    <small>This is a recording of the standalone instrument. The playable app currently runs on Mac.</small>
  </main>
</body>
</html>
